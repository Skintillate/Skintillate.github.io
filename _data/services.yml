# Services in display order. `ref` matches the `ref` in each service page's front matter;
# `slug` is the URL under /services/ (the same slug is used for every language).
- ref: clinical-dermatology
  slug: clinical-dermatology
  group: dermatology
  en:
    name: Clinical Dermatology
    blurb: Diagnosis and treatment of eczema, psoriasis, skin allergies, fungal infections and other skin conditions.

- ref: acne
  slug: acne-scar-treatment
  group: dermatology
  en:
    name: Acne & Acne Scars
    blurb: Treatment plans to control active acne, then peels, microneedling, subcision and laser to improve scars.

- ref: pigmentation
  slug: pigmentation-treatment
  group: dermatology
