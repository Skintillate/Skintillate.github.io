{% include vars.html -%}
<!doctype html>
<html lang="{{ t.hreflang }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">{{ t.skip_to_content }}</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.getElementById('site-nav');
    function setOpen(open) {
      toggle.setAttribute('aria-expanded', String(open));
      nav.classList.toggle('is-open', open);
    }
    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    // Escape closes the menu and puts focus back on the menu button.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav.classList.contains('is-open')) {
        setOpen(false);
        toggle.focus();
      }
    });
    // Reset the menu when the window grows past the phone layout, so it isn't left open.
    var desktop = window.matchMedia('(min-width: 901px)');
    var reset = function () { if (desktop.matches) setOpen(false); };
    if (desktop.addEventListener) desktop.addEventListener('change', reset);
    else desktop.addListener(reset);
  })();
</script>
</body>
</html>
